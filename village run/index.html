<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forest Run</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="start-page">
        <h2>Forest Run</h2>
        <p class="hint">tap / click / space / ↑ to jump</p>
        <button class="play-btn" id="playBtn">play</button>
    </div>

    <div class="game-page">
        <div class="score">score : 0</div>
        <div class="character-container">
            <img src="images/village/boy.gif" id="character" alt="boy-gif">
        </div>
        <div class="obstacle-container"></div>
    </div>

    <div class="game-over-page">
        <h2>game over</h2>
        <p class="final-score">score : 0</p>
        <button class="restart-btn" id="restartBtn">play again</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
