<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Play Games by Pasi Abhishek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <style>
        body {
            min-height: 100vh;
            background: #121212;
        }

        .navbar {
            border-bottom: 1px solid #333;
        }

        .game-container {
            min-height: calc(100vh - 56px);
            padding: 50px 20px;
            
            display: flex;
            justify-content: space-around;
        }

        .game-card {
            height: 100%;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 1.8rem;
        }

        .card-text {
            color: #aaa;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container">
            <a class="navbar-brand text-light fw-bold" href="#">
                🎮 Play Games by Pasi Abhishek
            </a>
        </div>
    </nav>


    <!-- Games -->
    <div class="game-container">
        <div class="container">
            <div class="row g-4" style="margin: auto;">

                <!-- Forest Run -->
                <div class="col-md-6">
                    <div class="card game-card bg-dark text-light">
                        <div class="card-body">
                            <h5 class="card-title">
                                🌲 Forest Run
                            </h5>
                            <p class="card-text">
                                A pixel-art endless runner set in a sleepy village.
                                Tap, click, or hit space to leap over obstacles as
                                they race toward you.
                            </p>
                            <a href="village run/index.html"
                                class="btn btn-primary">
                                Play Now
                            </a>
                        </div>
                    </div>
                </div>


                <!-- Space Shooter
                <div class="col-md-6">

                    <div class="card game-card bg-dark text-light">

                        <div class="card-body">

                            <h5 class="card-title">
                                🚀 Space Shooter
                            </h5>

                            <p class="card-text">
                                Defend your spaceship from waves of enemies.
                                Dodge incoming attacks, destroy enemies, and
                                survive for the highest score.
                            </p>

                            <a href="space shooter/index.html"
                                class="btn btn-primary">
                                Play Now
                            </a>

                        </div>

                    </div> -->

                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
